  #             count: all
  #             capabilities: [gpu]
  #   restart: unless-stopped

  # Optional: vLLM chat model (GPU 0)
  # vllm-chat:
  #   image: vllm/vllm-openai:latest
  #   container_name: neurogateway-vllm-chat
  #   ports:
  #     - "8000:8000"
  #   environment:
  #     - CUDA_VISIBLE_DEVICES=0
  #   command: ["--model", "Qwen/Qwen3-VL-4B", "--port", "8000"]
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             device_ids: ["0"]
  #             capabilities: [gpu]
  #   restart: unless-stopped

  # Optional: vLLM embedding model (GPU 1)
  # vllm-embed:
