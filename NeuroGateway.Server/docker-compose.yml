# NeuroGateway Docker Compose
# Usage:
#   Development (local postgres):  docker compose --profile dev up -d
#   Production  (Supabase):        docker compose --profile prod up -d
#   Rebuild:                       docker compose --profile dev up -d --build
#   Logs:                          docker compose logs -f mcp

services:
  # MCP Server - Multi-Agent AI
  mcp:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: neurogateway-server
    profiles: ["dev", "prod"]
    ports:
      - "13370:13370"
    env_file:
      - ../.env
    environment:
      - ASPNETCORE_URLS=http://+:13370
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:13370/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # PostgreSQL - Personality Storage (dev only)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: neurogateway-postgres
    profiles: ["dev"]
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=personality
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Optional: Ollama (if you want Ollama in Docker too)
  # ollama:
  #   image: ollama/ollama:latest
