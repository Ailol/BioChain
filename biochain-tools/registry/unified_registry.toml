# BioChain Unified Registry — ported from tools/biochain_grammar_gen.py
# Source of truth for ligand→receptor→cascade→target knowledge graph

# ═══════════════════════════════════════
# BINDINGS: ligand → [(receptor, coupling), ...]
# ═══════════════════════════════════════

# L.nt neurotransmitters
[bindings.DA]
receptors = [
    { receptor = "D1", coupling = "Gs" },
    { receptor = "D2", coupling = "Gi" },
    { receptor = "D3", coupling = "Gi" },
    { receptor = "D4", coupling = "Gi" },
    { receptor = "D5", coupling = "Gs" },
    { receptor = "TAAR1", coupling = "Gs" },
]

[bindings."5HT"]
receptors = [
    { receptor = "5HT1A", coupling = "Gi" },
    { receptor = "5HT1B", coupling = "Gi" },
    { receptor = "5HT2A", coupling = "Gq" },
    { receptor = "5HT2B", coupling = "Gq" },
    { receptor = "5HT2C", coupling = "Gq" },
    { receptor = "5HT3", coupling = "ion_Na" },
    { receptor = "5HT4", coupling = "Gs" },
    { receptor = "5HT6", coupling = "Gs" },
    { receptor = "5HT7", coupling = "Gs" },
]

[bindings.NE]
receptors = [
    { receptor = "a1", coupling = "Gq" },
    { receptor = "a2A", coupling = "Gi" },
    { receptor = "a2B", coupling = "Gi" },
    { receptor = "a2C", coupling = "Gi" },
    { receptor = "b1", coupling = "Gs" },
    { receptor = "b2", coupling = "Gs" },
    { receptor = "b3", coupling = "Gs" },
]

[bindings.GABA]
receptors = [
    { receptor = "GABA-A", coupling = "ion_Cl" },
    { receptor = "GABA-B", coupling = "Gi" },
]

[bindings.GLU]
receptors = [
    { receptor = "NMDA", coupling = "ion_Ca" },
    { receptor = "AMPA", coupling = "ion_Na" },
    { receptor = "kainate", coupling = "ion_Na" },
    { receptor = "mGluR1", coupling = "Gq" },
    { receptor = "mGluR2", coupling = "Gi" },
    { receptor = "mGluR3", coupling = "Gi" },
    { receptor = "mGluR4", coupling = "Gi" },
    { receptor = "mGluR5", coupling = "Gq" },
]

[bindings.ACh]
receptors = [
    { receptor = "nAChR", coupling = "ion_Na" },
    { receptor = "mAChR", coupling = "Gq" },
    { receptor = "M1", coupling = "Gq" },
    { receptor = "M2", coupling = "Gi" },
    { receptor = "M3", coupling = "Gq" },
    { receptor = "M4", coupling = "Gi" },
    { receptor = "M5", coupling = "Gq" },
]

[bindings.adenosine]
receptors = [
    { receptor = "A1", coupling = "Gi" },
    { receptor = "A2A", coupling = "Gs" },
    { receptor = "A2B", coupling = "Gs" },
    { receptor = "A3", coupling = "Gi" },
]

[bindings.histamine]
receptors = [
    { receptor = "H1", coupling = "Gq" },
    { receptor = "H2", coupling = "Gs" },
    { receptor = "H3", coupling = "Gi" },
    { receptor = "H4", coupling = "Gi" },
]

[bindings.glycine]
receptors = [
    { receptor = "GlyR", coupling = "ion_Cl" },
    { receptor = "NMDA", coupling = "ion_Ca" },
]

[bindings."D-serine"]
receptors = [
    { receptor = "NMDA", coupling = "ion_Ca" },
]

[bindings.ATP]
receptors = [
    { receptor = "P2X", coupling = "ion_Ca" },
    { receptor = "P2Y", coupling = "Gq" },
]

