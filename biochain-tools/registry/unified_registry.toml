# ═══════════════════════════════════════
# COUPLING → SECOND MESSENGERS
# ═══════════════════════════════════════

[coupling_to_2m]
Gs = ["cAMP"]
Gi = ["cAMP"]
Gq = ["IP3", "DAG"]
G12 = ["Rho"]
cGMP = ["cGMP"]

# ═══════════════════════════════════════
# SECOND MESSENGER → KINASES
# ═══════════════════════════════════════

[sm_to_kinase]
cAMP = ["PKA", "EPAC"]
IP3 = ["PKC"]
DAG = ["PKC"]
ion_Ca = ["CaMKII", "CaMKIV", "calcineurin", "PKC"]
ion_Cl = []
ion_Na = []
Rho = ["ROCK"]
cGMP = ["PKG"]

# ═══════════════════════════════════════
# KINASE → DOWNSTREAM TARGETS
# ═══════════════════════════════════════

[kinase_targets]
PKA = ["CREB", "DARPP-32", "GluA1", "TH", "TPH2"]
PKC = ["MARCKS", "GAP43", "CREB", "NF-kB"]
CaMKII = ["CREB", "GluA1", "TH", "TPH2", "nNOS"]
CaMKIV = ["CREB"]
calcineurin = ["NFAT"]
EPAC = ["Rap1"]
ROCK = ["LIMK", "MLC"]
PKG = ["VASP", "CREB"]
ERK = ["CREB", "Elk-1"]
Akt = ["mTOR", "GSK3b", "CREB", "BAD", "FOXO"]
PI3K = ["Akt"]
PLCg = ["IP3", "DAG"]
JNK = ["c-Jun", "AP-1"]
JAK2 = ["STAT3", "STAT5", "STAT1"]
JAK1 = ["STAT3", "STAT1", "STAT5"]
TYK2 = ["STAT1", "STAT3"]
GSK3b = ["b-catenin", "tau"]

# ═══════════════════════════════════════
# NUCLEAR RECEPTOR → TF TARGETS
# ═══════════════════════════════════════

[nr_tf]
GR = ["NF-kB", "CREB", "AP-1"]
MR = ["NF-kB", "SGK1", "CREB"]
ERa = ["CREB", "AP-1", "Sp1", "NF-kB"]
ERb = ["CREB", "AP-1"]
TRa = ["CREB"]
TRb = ["CREB", "NF-kB"]
PR = ["CREB", "AP-1", "NF-kB"]
AR = ["CREB", "AP-1"]
AhR = ["ARNT", "NF-kB"]

# ═══════════════════════════════════════
# RTK → KINASES (receptor-specific)
# ═══════════════════════════════════════

[rtk_kinases]
TrkB = ["ERK", "Akt", "PLCg"]
TrkA = ["ERK", "Akt", "PLCg"]
p75NTR = ["JNK", "NF-kB"]
InsR = ["PI3K", "Akt", "ERK"]

# ═══════════════════════════════════════
# JAK-STAT → JAK KINASES (receptor-specific)
# ═══════════════════════════════════════

[jakstat_kinases]
LepR = ["JAK2"]
PRLR = ["JAK2"]
IL6R = ["JAK1", "JAK2"]
IL10R = ["JAK1", "TYK2"]
IFNGR = ["JAK1", "JAK2"]
TNFR1 = ["JAK1"]
TNFR2 = ["JAK1"]
IL1R1 = ["JAK1"]
TLR4 = ["JAK1"]

# ═══════════════════════════════════════
# ENZYME → PRODUCT
# ═══════════════════════════════════════

[enzyme_product]
TH = "DA"
DDC = "DA"
DBH = "NE"
TPH1 = "5HT"
TPH2 = "5HT"
GAD67 = "GABA"
GAD65 = "GABA"
ChAT = "ACh"
IDO = "KYN"
"5a-reductase" = "allopregnanolone"
CYP19A1 = "estradiol"
deiodinase_D2 = "T3"
deiodinase_D1 = "T3"
deiodinase_D3 = "rT3"
GLS = "GLU"
GS = "GLN"
nNOS = "NO"
iNOS = "NO"
eNOS = "NO"
AANAT = "NAS"
ASMT = "melatonin"
BACE1 = "amyloid-b"
"g-secretase" = "amyloid-b"

# ═══════════════════════════════════════
# DEGRADATION ENZYMES
# ═══════════════════════════════════════

[degradation_enzymes]
enzymes = [
    "MAO-A", "MAO-B", "COMT", "CYP3A4", "MAGL", "FAAH",
    "11b-HSD2", "ADH", "ALDH2", "COX1", "COX2",
    "AChE", "BChE",
]

# ═══════════════════════════════════════
# TRANSPORTER → SUBSTRATES
# ═══════════════════════════════════════

[transporter_substrate]
DAT = ["DA"]
SERT = ["5HT"]
NET = ["NE"]
VMAT2 = ["DA", "5HT", "NE"]
LAT1 = ["TRP"]
EAAT2 = ["GLU"]
GAT1 = ["GABA"]
SN1 = ["GLN"]
