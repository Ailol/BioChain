<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BioChain Graph Viewer</title>
<script src="https://unpkg.com/cytoscape@3.30.4/dist/cytoscape.min.js"></script>
<script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
<script src="https://unpkg.com/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0a0a1a; color: #e0e0e0; }
  #toolbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    background: #12122a; border-bottom: 1px solid #2a2a5a;
    padding: 10px 20px; display: flex; align-items: center; gap: 15px;
  }
  #toolbar h1 { font-size: 16px; color: #7af; margin-right: 20px; }
  #toolbar label { font-size: 12px; color: #aaa; }
  #toolbar select, #toolbar input {
    background: #1a1a3a; color: #e0e0e0; border: 1px solid #3a3a6a;
    padding: 4px 8px; border-radius: 4px; font-size: 12px;
  }
  #toolbar button {
    background: #2a4a8a; color: white; border: none; padding: 6px 14px;
    border-radius: 4px; cursor: pointer; font-size: 12px;
  }
  #toolbar button:hover { background: #3a6aba; }
  #cy { position: fixed; top: 50px; left: 0; right: 300px; bottom: 0; background: #0a0a1a; }
  #sidebar {
    position: fixed; top: 50px; right: 0; width: 300px; bottom: 0;
    background: #12122a; border-left: 1px solid #2a2a5a;
    overflow-y: auto; padding: 15px;
  }
  #sidebar h2 { font-size: 14px; color: #7af; margin-bottom: 10px; }
  #sidebar .stat { font-size: 12px; color: #aaa; margin: 4px 0; }
  #sidebar .stat span { color: #fff; }
  #node-detail { margin-top: 15px; }
  #node-detail h3 { font-size: 13px; color: #fa7; margin-bottom: 8px; }
  .legend { margin-top: 15px; }
  .legend-item { display: flex; align-items: center; gap: 8px; margin: 4px 0; font-size: 11px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; }
  #api-url { width: 280px; }
  #program-id { width: 60px; }
</style>
</head>
<body>
<div id="toolbar">
  <h1>BioChain Graph</h1>
  <label>API:</label>
  <input id="api-url" type="text" value="http://localhost:58554/api/biochain">
  <label>Program:</label>
  <input id="program-id" type="number" value="3" min="1">
  <button onclick="loadGraph()">Load</button>
  <label>Layout:</label>
  <select id="layout-select" onchange="relayout()">
    <option value="dagre">Dagre (Hierarchical)</option>
    <option value="cose">CoSE (Force)</option>
    <option value="breadthfirst">Breadth-first</option>
    <option value="circle">Circle</option>
    <option value="concentric">Concentric</option>
  </select>
  <button onclick="cy.fit(undefined, 40)">Fit</button>
  <button onclick="exportPng()">PNG</button>
</div>

<div id="cy"></div>

<div id="sidebar">
  <h2>Graph Stats</h2>
  <div class="stat">Nodes: <span id="s-nodes">-</span></div>
  <div class="stat">Edges: <span id="s-edges">-</span></div>
  <div class="stat">Roots: <span id="s-roots">-</span></div>
  <div class="stat">Regions: <span id="s-regions">-</span></div>
  <div class="stat">Kinds: <span id="s-kinds">-</span></div>

  <div class="legend">
    <h2>Node Types</h2>
    <div id="legend-items"></div>
  </div>

  <div id="node-detail">
    <h3>Click a node to inspect</h3>
  </div>
</div>

<script>
const KIND_COLORS = {
  'L.nt':   '#ff6b6b',
  'L.h':    '#ff9f43',
  'L.p':    '#ffd93d',
  'R':      '#6bcb77',
  'Gp':     '#4ecdc4',
  '2m':     '#45b7d1',
  'K':      '#96ceb4',
  'Ph':     '#ff85a2',
  'TF':     '#c792ea',
  'G':      '#e2b0ff',
  'E':      '#f0e68c',
  'Ch':     '#87ceeb',
  'Ch.vg':  '#78a5c7',
  'N.5ht':  '#ff6b6b',
  'N.gaba': '#ffa07a',
  'N.da':   '#98fb98',
  'T':      '#dda0dd',
  'V':      '#bc8f8f',
  'Mt':     '#8fbc8f',
  'M.atp':  '#20b2aa',
};
const DEFAULT_COLOR = '#888';

function kindColor(kind) {
  return KIND_COLORS[kind] || KIND_COLORS[kind.split('.')[0]] || DEFAULT_COLOR;
}

let cy;

function initCy(elements) {
  if (cy) cy.destroy();
  cy = cytoscape({
    container: document.getElementById('cy'),
    elements: elements,
    style: [
      {
        selector: 'node',
        style: {
          'label': 'data(label)',
          'background-color': 'data(color)',
          'color': '#fff',
          'text-valign': 'bottom',
          'text-halign': 'center',
          'font-size': '10px',
          'text-margin-y': 4,
          'width': 'data(size)',
          'height': 'data(size)',
          'border-width': 2,
          'border-color': 'data(borderColor)',
          'text-outline-color': '#0a0a1a',
          'text-outline-width': 2,
        }
      },
      {
        selector: 'node[?isRoot]',
        style: {
          'shape': 'diamond',
          'border-width': 3,
          'border-color': '#ff0',
        }
      },
      {
        selector: 'node:selected',
        style: {
          'border-color': '#fff',
          'border-width': 4,
          'text-outline-color': '#fa7',
        }
      },
      {
        selector: 'edge',
        style: {
          'width': 2,
          'line-color': '#3a3a6a',
          'target-arrow-color': '#5a5a9a',
          'target-arrow-shape': 'data(arrowShape)',
          'curve-style': 'bezier',
          'arrow-scale': 1.2,
          'label': 'data(label)',
          'font-size': '8px',
          'color': '#888',
          'text-rotation': 'autorotate',
          'text-outline-color': '#0a0a1a',
          'text-outline-width': 1,
        }
      },
      {
        selector: 'edge[edgeType = "inhibit"]',
        style: {
          'line-color': '#ff4444',
          'target-arrow-color': '#ff4444',
          'target-arrow-shape': 'tee',
          'line-style': 'dashed',
        }
      },
      {
        selector: 'edge[edgeType = "activate"]',
        style: { 'line-color': '#4488ff', 'target-arrow-color': '#4488ff' }
      },
      {
        selector: 'edge[edgeType = "bidirectional"]',
        style: {
          'line-color': '#44ff88',
          'target-arrow-color': '#44ff88',
          'source-arrow-color': '#44ff88',
          'source-arrow-shape': 'triangle',
        }
      },
      {
        selector: '.highlighted',
        style: { 'border-color': '#ff0', 'border-width': 4 }
      },
      {
        selector: '.faded',
        style: { 'opacity': 0.2 }
      },
    ],
    layout: { name: 'dagre', rankDir: 'LR', nodeSep: 50, rankSep: 80 },
    wheelSensitivity: 0.3,
  });

  cy.on('tap', 'node', function(e) {
    var d = e.target.data();
    showNodeDetail(d, e.target);
    cy.elements().removeClass('faded highlighted');
    var connected = e.target.closedNeighborhood();
    cy.elements().not(connected).addClass('faded');
    connected.addClass('highlighted');
  });

  cy.on('tap', function(e) {
    if (e.target === cy) {
      cy.elements().removeClass('faded highlighted');
      var detail = document.getElementById('node-detail');
      while (detail.firstChild) detail.removeChild(detail.firstChild);
      var h = document.createElement('h3');
      h.textContent = 'Click a node to inspect';
      detail.appendChild(h);
    }
  });
}

function showNodeDetail(d, node) {
  var detail = document.getElementById('node-detail');
  while (detail.firstChild) detail.removeChild(detail.firstChild);

  function addLine(label, value) {
    var div = document.createElement('div');
    div.style.cssText = 'font-size:11px;margin:3px 0;color:#ccc';
    var b = document.createElement('b');
    b.style.color = '#7cf';
    b.textContent = label + ': ';
    div.appendChild(b);
    div.appendChild(document.createTextNode(value));
    detail.appendChild(div);
  }

  var h = document.createElement('h3');
  h.textContent = d.label;
  detail.appendChild(h);

  addLine('ID', d.nodeId);
  addLine('Code', d.code);
  addLine('Kind', d.kind);
  addLine('Region', d.region || '\u2014');
  addLine('Root', d.isRoot ? 'Yes' : 'No');
  if (d.stateSym) addLine('State', d.stateSym + (d.stateVal != null ? ' = ' + d.stateVal : ''));
  if (d.deltaSign) addLine('Delta', d.deltaSign + (d.deltaVal != null ? d.deltaVal : ''));
  if (d.terminal) addLine('Terminal', d.terminal);
  if (d.props && d.props.length) addLine('Props', d.props.map(function(p){ return p.k + '=' + p.v; }).join(', '));
  addLine('Degree', node.degree());
  addLine('In-edges', node.indegree());
  addLine('Out-edges', node.outdegree());
}

async function loadGraph() {
  var base = document.getElementById('api-url').value.replace(/\/+$/, '');
  var pid = document.getElementById('program-id').value;
  try {
    var res = await fetch(base + '/program/' + pid);
    var data = await res.json();
    buildGraph(data);
  } catch (e) {
    alert('Failed to load: ' + e.message);
  }
}

function buildGraph(data) {
  var nodes = data.nodes || [];
  var edges = data.edges || [];
  var elements = [];
  var kindSet = {};
  var regionSet = {};
  var rootCount = 0;

  for (var i = 0; i < nodes.length; i++) {
    var n = nodes[i];
    var kind = n.kind || '?';
    var code = n.code || '#' + n.id;
    var region = n.region;
    var label = region ? code + '@' + region : code;
    kindSet[kind] = true;
    if (region) regionSet[region] = true;
    if (n.isRoot) rootCount++;

    elements.push({
      data: {
        id: 'n' + n.id,
        nodeId: n.id,
        label: label,
        code: code,
        kind: kind,
        region: region,
        isRoot: n.isRoot,
        color: kindColor(kind),
        borderColor: n.isRoot ? '#ff0' : kindColor(kind),
        size: n.isRoot ? 40 : 28,
        stateSym: n.state ? n.state.sym : null,
        stateVal: n.state ? n.state.val : null,
        deltaSign: n.state ? n.state.deltaSign : null,
        deltaVal: n.state ? n.state.deltaVal : null,
        terminal: n.terminal,
        props: n.props || [],
      }
    });
  }

  for (var j = 0; j < edges.length; j++) {
    var e = edges[j];
    var edgeType = e.edgeType || 'activate';
    var arrowShape = 'triangle';
    var elabel = '';
    if (edgeType === 'inhibit' || edgeType === '\u22A3') { arrowShape = 'tee'; elabel = '\u22A3'; edgeType = 'inhibit'; }
    else if (edgeType === 'bidirectional' || edgeType === '\u21CC') { arrowShape = 'triangle'; elabel = '\u21CC'; edgeType = 'bidirectional'; }
    else { arrowShape = 'triangle'; edgeType = 'activate'; }

    elements.push({
      data: {
        id: 'e' + e.id,
        source: 'n' + e.sourceId,
        target: 'n' + e.targetId,
        edgeType: edgeType,
        arrowShape: arrowShape,
        label: elabel,
        weight: e.weight,
        tag: e.tag,
      }
    });
  }

  initCy(elements);

  document.getElementById('s-nodes').textContent = nodes.length;
  document.getElementById('s-edges').textContent = edges.length;
  document.getElementById('s-roots').textContent = rootCount;
  document.getElementById('s-regions').textContent = Object.keys(regionSet).join(', ') || '\u2014';
  document.getElementById('s-kinds').textContent = Object.keys(kindSet).length;

  // Build legend safely
  var legendContainer = document.getElementById('legend-items');
  while (legendContainer.firstChild) legendContainer.removeChild(legendContainer.firstChild);
  var kinds = Object.keys(kindSet).sort();
  for (var ki = 0; ki < kinds.length; ki++) {
    var item = document.createElement('div');
    item.className = 'legend-item';
    var dot = document.createElement('div');
    dot.className = 'legend-dot';
    dot.style.background = kindColor(kinds[ki]);
    item.appendChild(dot);
    var span = document.createElement('span');
    span.textContent = kinds[ki];
    item.appendChild(span);
    legendContainer.appendChild(item);
  }
}

function relayout() {
  var name = document.getElementById('layout-select').value;
  var opts = { name: name, animate: true, animationDuration: 500 };
  if (name === 'dagre') { opts.rankDir = 'LR'; opts.nodeSep = 50; opts.rankSep = 80; }
  if (name === 'concentric') {
    opts.concentric = function(n) { return n.data('isRoot') ? 10 : n.degree(); };
    opts.levelWidth = function() { return 2; };
  }
  cy.layout(opts).run();
}

function exportPng() {
  var png = cy.png({ full: true, scale: 2, bg: '#0a0a1a' });
  var a = document.createElement('a');
  a.href = png;
  a.download = 'biochain-graph.png';
  a.click();
}

window.addEventListener('DOMContentLoaded', loadGraph);
</script>
</body>
</html>
