replicaCount: 1

image:
  repository: ailol/mcpserver
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 13370

resources:
  requests:
    memory: "128Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "250m"

env:
  ASPNETCORE_URLS: "http://+:13370"
  OLLAMA_ENDPOINT: "http://ollama-proxy:11434"
