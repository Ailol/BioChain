apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailscale-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tailscale-proxy
  template:
    metadata:
      labels:
        app: tailscale-proxy
    spec:
      containers:
      - name: tailscale
        image: tailscale/tailscale:latest
        env:
        - name: TS_AUTHKEY
          valueFrom:
            secretKeyRef:
              name: tailscale-auth
              key: authkey
        - name: TS_USERSPACE
          value: "true"
        - name: TS_HOSTNAME
          value: "aks-ollama-proxy"
        - name: TS_STATE_DIR
          value: "/var/lib/tailscale"
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: tailscale-state
          mountPath: /var/lib/tailscale
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      - name: socat
        image: alpine:latest
        command:
        - /bin/sh
        - -c
        - |
          apk add --no-cache socat
          sleep 15
          socat TCP-LISTEN:11434,fork,reuseaddr TCP:100.104.149.87:11434
        ports:
        - containerPort: 11434
        resources:
          requests:
            memory: "32Mi"
            cpu: "25m"
          limits:
            memory: "64Mi"
            cpu: "50m"
      volumes:
      - name: tailscale-state
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-proxy
spec:
  type: ClusterIP
  ports:
  - port: 11434
    targetPort: 11434
  selector:
    app: tailscale-proxy
