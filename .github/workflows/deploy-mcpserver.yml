name: Build and Deploy MCP Server

on:
  push:
    branches: [main]
    paths:
      - 'McpServer/**'
      - 'Models/**'
      - 'Agents/**'
      - 'Dockerfile'
      - 'k8s/charts/mcpserver/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ailol
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ailol/mcpserver:latest,ailol/mcpserver:${{ github.sha }}

      - name: Install Helm
        uses: azure/setup-helm@v3

      - name: Set up kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Deploy to AKS
        run: |
          helm upgrade --install mcpserver ./k8s/charts/mcpserver \
            --set image.tag=${{ github.sha }} \
            --set secrets.postgresConnectionString="${{ secrets.POSTGRES_CONNECTION_STRING }}"
