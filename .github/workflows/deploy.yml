name: Deploy to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy MCP Server
        run: |
          railway variables set "ConnectionStrings__Personality=${{ secrets.POSTGRES_CONNECTION_STRING }}" --service mcpserver || true
          railway variables set "OLLAMA_ENDPOINT=${{ secrets.OLLAMA_ENDPOINT }}" --service mcpserver || true
          railway variables set "OLLAMA_MODEL=${{ secrets.OLLAMA_MODEL }}" --service mcpserver || true
          railway variables set "OpenClaw__Enabled=false" --service mcpserver || true
          railway variables set "ASPNETCORE_URLS=http://+:13370" --service mcpserver || true
          railway up --detach --service mcpserver
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-openclaw:
    runs-on: ubuntu-latest
    needs: deploy-mcp
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy OpenClaw
        run: |
          cd openclaw
          railway variables set "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" --service openclaw || true
          railway up --detach --service openclaw
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
