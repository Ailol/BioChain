# ════════════════════════════════════════════════════════════
# CONFIG RESOLUTION — How to merge
# ════════════════════════════════════════════════════════════
# Runtime resolver should merge in this order:
#
#   resolved = defaults
#              .deep_merge(layers[current_layer])
#              .deep_merge(modes[current_mode])
#
# Chemical subspace_weights are looked up directly, not merged.
# Estimation weights come from layers[layer].estimation_weights.
# Interaction maps come from chemicals[chemical].potentiates/antagonizes.
# Relationship signals come from chemicals[chemical].relationship_signals.
#
# Example for NTAgent in dating mode:
#   pooling.strategy = attentive_temporal_decay  (from layers.neurotransmitter)
#   pooling.attention_temperature = 0.3          (from modes.dating, overrides layer)
#   pooling.temporal_half_life = 5               (from layers.neurotransmitter)
#   scoring.message_weight = 0.65                (from modes.dating)
#   scoring.top_per_chemical = 2                 (from layers.neurotransmitter)
#   scoring.freshness_boost = 1.8                (from modes.dating, overrides layer's 1.6)
#   drift.shift_threshold = 0.05                 (from modes.dating)
#   drift.velocity_window = 3                    (from layers.neurotransmitter)