# ============================================================
# ALGORITHM CONFIG — Global tuning surface
# ============================================================
# Single file. All algorithm behavior lives here.
# Agent YAMLs define WHAT agents say.
# This file defines HOW vectors are scored, pooled, drifted,
# clustered, and interpreted.
#
# Three sections:
#   modes    → per relationship mode (scoring, coherence, drift, attractors)
#   layers   → per biochemical layer (temporal dynamics, pooling, clustering)
#   chemicals → per chemical (subspace weights, interactions, relationship signals)
#
# Resolution order: chemical → layer → mode → defaults
# More specific overrides less specific.
# ============================================================


# ════════════════════════════════════════════════════════════
# DEFAULTS — Applied when no specific config exists
# ════════════════════════════════════════════════════════════

defaults:
  scoring:
    message_weight: 0.55
    freshness_boost: 1.3
    min_similarity: 0.15
    top_per_chemical: 1

  pooling:
    strategy: attentive              # mean | temporal_decay | attentive | attentive_temporal_decay | max | confidence_weighted
    attention_temperature: 0.8
    temporal_half_life: 15
    min_entries_for_strategy: 5

  drift:
    shift_threshold: 0.12
    std_dev_multiplier: 1.5
    velocity_window: 5
    noise_floor: 0.04
    subspace_drift_weight: 0.5

  coherence:
    low_threshold: 0.45
    interpretation: neutral          # opportunity | alarm | expected | neutral | boundary
    layer_pair_weights:
      nt_hormone: 0.33
      nt_peptide: 0.33
      hormone_peptide: 0.34

  attractors:
    threshold: 0.82
    min_visits: 2
    max_attractors: 8
    track_transitions: false

  clustering:
    threshold: 0.78
    k_neighbors: 3
    min_cluster_size: 2

  subspace:
    num_bands: 16                    # 16 × 256 = 4096
    band_dim: 256
    divergence_threshold: 0.40


# ════════════════════════════════════════════════════════════
# MODES — Per relationship mode overrides
# ════════════════════════════════════════════════════════════
# Only specify what DIFFERS from defaults.
# Omitted fields inherit from defaults.

modes:
  dating:
    scoring:
      message_weight: 0.65
      freshness_boost: 1.8
    pooling:
      attention_temperature: 0.3      # laser focus on current signal
    drift:
      shift_threshold: 0.05           # hypersensitive — every signal matters
      std_dev_multiplier: 1.2
    coherence:
      interpretation: opportunity      # tension creates attraction
      low_threshold: 0.45
      layer_pair_weights:
        nt_hormone: 0.25
        nt_peptide: 0.45              # desire vs emotional readiness
        hormone_peptide: 0.30
    attractors:
      threshold: 0.75                  # shallow forming basins
      max_attractors: 10
      track_transitions: true

  partner:
    scoring:
      message_weight: 0.50
      freshness_boost: 1.4
    pooling:
      attention_temperature: 0.8
    drift:
      shift_threshold: 0.10
    coherence:
      interpretation: alarm            # misalignment needs attention
      low_threshold: 0.48
      layer_pair_weights:
        nt_hormone: 0.30
        nt_peptide: 0.35
        hormone_peptide: 0.35
    attractors:
      threshold: 0.85
      min_visits: 3
      track_transitions: true

  relationship:
    scoring:
      message_weight: 0.55
      freshness_boost: 1.5
    pooling:
      attention_temperature: 0.6
    drift:
      shift_threshold: 0.10
    coherence:
      interpretation: alarm
      low_threshold: 0.48
      layer_pair_weights:
        nt_hormone: 0.30
        nt_peptide: 0.40
        hormone_peptide: 0.30
    attractors:
      threshold: 0.82
      track_transitions: true

  family:
    scoring:
      message_weight: 0.35            # deep pattern dominates
      freshness_boost: 1.1
      min_similarity: 0.20
    pooling:
      attention_temperature: 1.5       # broad context
    drift:
      shift_threshold: 0.25           # tolerant — only ruptures
      std_dev_multiplier: 2.0
    coherence:
      interpretation: alarm            # internal conflict = repair needed
      low_threshold: 0.50
      layer_pair_weights:
        nt_hormone: 0.20
        nt_peptide: 0.25
        hormone_peptide: 0.55         # deep alignment matters most
    attractors:
      threshold: 0.90                  # deep stable basins
      min_visits: 3
      max_attractors: 5

  conflict:
    scoring:
      message_weight: 0.80            # current state is everything
      freshness_boost: 2.0
      min_similarity: 0.10
    pooling:
      attention_temperature: 0.2       # sharpest focus
    drift:
      shift_threshold: 0.08           # catch escalation early
      std_dev_multiplier: 1.0
    coherence:
      interpretation: expected         # dysregulation is the norm here
      low_threshold: 0.35
      layer_pair_weights:
        nt_hormone: 0.50              # fast vs slow mismatch = escalation
        nt_peptide: 0.30
        hormone_peptide: 0.20
    attractors:
      threshold: 0.80
      track_transitions: true          # oscillation patterns matter

  friend:
    scoring:
      message_weight: 0.55
      freshness_boost: 1.3
    pooling:
      attention_temperature: 1.0
    drift:
      shift_threshold: 0.12
    coherence:
      interpretation: neutral
      low_threshold: 0.40

  mindhat:
    scoring:
      message_weight: 0.60
      freshness_boost: 1.4
    pooling:
      attention_temperature: 0.5
    drift:
      shift_threshold: 0.10
    coherence:
      interpretation: neutral

  colleague:
    scoring:
      message_weight: 0.55
      freshness_boost: 1.3
      min_similarity: 0.20
    pooling:
      attention_temperature: 1.2
    drift:
      shift_threshold: 0.15
      std_dev_multiplier: 1.8
    coherence:
      interpretation: neutral
    attractors:
      threshold: 0.85
      min_visits: 3
      max_attractors: 5

  exwife:
    scoring:
      message_weight: 0.75            # read their boundary precisely
      freshness_boost: 1.6
      min_similarity: 0.20
    pooling:
      attention_temperature: 0.4
    drift:
      shift_threshold: 0.10
    coherence:
      interpretation: boundary         # low coherence = don't push
      low_threshold: 0.40
      layer_pair_weights:
        nt_hormone: 0.30
        nt_peptide: 0.40
        hormone_peptide: 0.30
    attractors:
      threshold: 0.85
      track_transitions: true          # track manipulation patterns

  acquaintance:
    scoring:
      message_weight: 0.50
      freshness_boost: 1.2
      min_similarity: 0.25
    pooling:
      attention_temperature: 1.5
    drift:
      shift_threshold: 0.20
      std_dev_multiplier: 2.0
    coherence:
      interpretation: neutral
      low_threshold: 0.35
    attractors:
      threshold: 0.88
      min_visits: 3
      max_attractors: 3


# ════════════════════════════════════════════════════════════
# LAYERS — Per biochemical layer overrides
# ════════════════════════════════════════════════════════════
# Defines temporal dynamics — how fast each layer moves.
# These override defaults but are overridden by mode-specific values.

layers:
  neurotransmitter:
    # Fast signals — milliseconds to seconds
    pooling:
      strategy: attentive_temporal_decay
      temporal_half_life: 5            # aggressive decay
    drift:
      velocity_window: 3               # fast measurement
      noise_floor: 0.03
      subspace_drift_weight: 0.4
    scoring:
      top_per_chemical: 2              # more rows — noisy layer needs redundancy
      freshness_boost: 1.6
    clustering:
      threshold: 0.70                  # more clusters — diverse signals
      min_cluster_size: 2

    # How much each NT chemical contributes to relationship estimation
    estimation_weights:
      dopamine: 1.2
      serotonin: 0.9
      norepinephrine: 1.0
      gaba: 0.6
      glutamate: 0.7
      acetylcholine: 0.8
      endocannabinoid: 0.7

  hormone:
    # Slow signals — hours to days
    pooling:
      strategy: confidence_weighted
      temporal_half_life: 20
      min_entries_for_strategy: 8
    drift:
      velocity_window: 8               # slow tide
      noise_floor: 0.05
      subspace_drift_weight: 0.6       # hormonal shifts are meaningful
    scoring:
      top_per_chemical: 1
      freshness_boost: 1.2
    clustering:
      threshold: 0.80                  # fewer broader clusters
      min_cluster_size: 3

    estimation_weights:
      oxytocin: 1.5
      cortisol: 1.3
      testosterone: 0.7
      estrogen: 0.8
      progesterone: 0.6
      vasopressin: 1.2
      melatonin: 0.4
      allopregnanolone: 0.5

  peptide:
    # Structural signals — weeks to lifetime
    pooling:
      strategy: confidence_weighted
      temporal_half_life: 50
      min_entries_for_strategy: 10
    drift:
      velocity_window: 15              # structural measurement
      noise_floor: 0.08
      subspace_drift_weight: 0.8       # peptide subspace shifts = significant
    scoring:
      top_per_chemical: 1
      freshness_boost: 1.1
    clustering:
      threshold: 0.85                  # tight clusters — structural patterns
      min_cluster_size: 3

    estimation_weights:
      oxytocin: 1.4
      vasopressin: 1.3
      endorphins: 1.0
      enkephalins: 0.8
      substance_p: 1.2
      npy: 1.1
      crh: 1.2
      dynorphin: 1.1
      bdnf: 0.7


