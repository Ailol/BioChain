  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             device_ids: ["0"]
  #             capabilities: [gpu]
  #   restart: unless-stopped

  # Optional: vLLM embedding model (GPU 1)
  # vllm-embed:
  #   image: vllm/vllm-openai:latest
