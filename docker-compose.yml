# NeuroGateway Docker Compose
# Usage:
#   docker-compose up -d                    # Start all services
#   docker-compose up -d --build            # Rebuild and start
#   docker-compose logs -f mcp              # View logs
#   docker-compose down                     # Stop all

services:
  # MCP Server - Multi-Agent AI
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neurogateway-server
    ports:
      - "13370:13370"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:13370
      - PERSONALITY_DB=Host=postgres;Port=5432;Database=personality;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
      # Per-purpose endpoints (override appsettings.json for Docker networking)
      - Llm__Orchestrator__Endpoint=http://host.docker.internal:11434
      - Llm__AgentAnalyzing__Endpoint=http://host.docker.internal:8000
      - Llm__Embedding__Endpoint=http://host.docker.internal:8000
      # API keys come from .env via env_file above
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:13370/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # PostgreSQL - Personality Storage
  postgres:
    image: pgvector/pgvector:pg16
    container_name: neurogateway-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=personality
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./NeuroGateway.Repository/Data/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./NeuroGateway.Repository/Data/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Optional: Ollama (if you want Ollama in Docker too)
  # ollama:
  #   image: ollama/ollama:latest
