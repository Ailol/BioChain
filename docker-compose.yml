services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: personality
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data


volumes:
  pgdata:
  ollama:
