# BioChain Docker Compose
# Usage:
#   docker-compose up -d                    # Start all services
#   docker-compose up -d --build            # Rebuild and start
#   docker-compose logs -f mcp              # View logs
#   docker-compose down                     # Stop all

services:
  # MCP Server - Multi-Agent AI
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: biochain-server
    ports:
      - "13370:13370"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:13370
      - ConnectionStrings__personality=Host=postgres;Port=5432;Database=personality;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
      # LLM config flows from appsettings.json (local vLLM defaults).
      # Override with env vars if needed:
      #   Llm__Orchestrator__ApiKey=sk-ant-xxx  → switches to Anthropic cloud
      #   Llm__Embedding__ApiKey=sk-xxx         → switches to OpenAI cloud
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:13370/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # PostgreSQL - Personality Storage
  postgres:
    image: pgvector/pgvector:pg16
    container_name: biochain-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=personality
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/Libraries/BioChain.Repository/Data/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./src/Libraries/BioChain.Repository/Data/biochain_init.sql:/docker-entrypoint-initdb.d/biochain_init.sql
      - ./src/Libraries/BioChain.Repository/Data/init_core.sql:/docker-entrypoint-initdb.d/init_core.sql
      - ./src/Libraries/BioChain.Repository/Data/views.sql:/docker-entrypoint-initdb.d/views.sql
      - ./src/Libraries/BioChain.Repository/Data/seed-questionnaire.sql:/docker-entrypoint-initdb.d/02-seed-questionnaire.sql
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  default:
    name: biochain-network
