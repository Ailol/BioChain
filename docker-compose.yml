# Chain Core — Infrastructure Services
# Usage:
#   docker compose up -d                    # Start all services
#   docker compose logs -f spacetimedb      # View logs
#   docker compose down                     # Stop all
#
# Module publish:
#   spacetime publish --server http://localhost:3000 biochain ./chain-core

services:
  # Neo4j — Graph Database
  neo4j:
    image: neo4j:5-community
    container_name: biochain-neo4j
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-biochain_graph}
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - ./neo4j/init.cypher:/var/lib/neo4j/import/init.cypher
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-biochain_graph}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # PostgreSQL — Relational storage (pgvector)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: biochain-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=biochain
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # SpacetimeDB — Relational database meets smart contracts
  spacetimedb:
    image: clockworklabs/spacetime:latest
    container_name: biochain-spacetimedb
    ports:
      - "3000:3000"
    volumes:
      - spacetimedb_data:/stdb/data
    command: ["start", "--data-dir=/stdb/data", "--listen-addr=0.0.0.0:3000"]
    user: "0:0"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/v1/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # biochain-tools — Reactome knowledge graph tool server (Rust/axum)
  biochain-tools:
    build:
      context: ./biochain-tools
      dockerfile: Dockerfile
    container_name: biochain-tools
    ports:
      - "8002:8002"
    environment:
      - BIOCHAIN_TOOLS_PORT=8002
      - BIOCHAIN_TOOLS_DB=/data/cache.db
      - BIOCHAIN_REACTOME_RATE_MS=100
    volumes:
      - biochain_tools_cache:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
  neo4j_data:
  spacetimedb_data:
  biochain_tools_cache:

networks:
  default:
    name: biochain-network
